  road_section_id:
    variableNameInDataset: Road Section ID
    variableNameInArticle: Junction-to-Junction Road Section Identifier
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Junction-to-Junction Road Section Identifier is used as accessibility and intervention unit. Unique
      identifier for one maximal continuous same-level road chain between true junctions. Transferred into the project as
      a read-only upstream-derived attribute and validated against every retained routable edge.
    variableSource: road_sections_preprocessed
    observationNumber: 343844
  road_section_length_m:
    variableNameInDataset: Road Section Length (m)
    variableNameInArticle: Junction-to-Junction Road Section Length
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Junction-to-Junction Road Section Length is used as failure exposure and cost proxy. Total routed
      length over all internal edges assigned to one Road Section ID. Summed from Road Length (m) within each Road Section
      ID; edge-to-section length equality and upper-tail quantiles were validated.
    variableSource: road_sections_preprocessed
    observationNumber: 343844
  road_edge_count:
    variableNameInDataset: Road Edge Count
    variableNameInArticle: Internal Routable Edge Count per Road Section
    variableAttribute: count
    variableUnit: Count
    variableDescription: Internal Routable Edge Count per Road Section is used as topology diagnostic. Number of internal
      routable edges assigned to one Road Section ID. Counted within Road Section ID and validated against the section table.
    variableSource: road_sections_preprocessed
    observationNumber: 343844
  route_name:
    variableNameInDataset: Route Name
    variableNameInArticle: Human-Readable Road Route Name
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Human-Readable Road Route Name is used as accessibility descriptor. Route name attached to a routable
      edge or road section when source matching is available. Retained after whitespace stripping; unmatched route names remain
      missing and are not imputed.
    variableSource: road_sections_preprocessed
    observationNumber: 10478
  road_failure_model:
    variableNameInDataset: Road Failure Model
    variableNameInArticle: Declared Road-Section Failure Mechanism
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Declared Road-Section Failure Mechanism is used as robustness scenario input. Named mechanism used
      to generate a stochastic road state. Length-Dependent Independent is finalized for the calibrated input table; Spatially
      Clustered and Hazard-Weighted remain analysis-stage alternatives.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 1719220
  expected_failed_road_length_share:
    variableNameInDataset: Expected Failed Road Length Share
    variableNameInArticle: Target Expected Unavailable Road-Length Share
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Target Expected Unavailable Road-Length Share is used as robustness severity input. Target share
      d of total eligible Road Section Length (m) expected to be unavailable under a declared failure model. Finalized levels
      are 0.5%, 1%, 3%, 5%, and 10%; the first is a near-baseline check and the last is a stress case.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 1719220
  failure_intensity_per_metre:
    variableNameInDataset: Failure Intensity per Metre
    variableNameInArticle: Calibrated Road Failure Intensity per Metre
    variableAttribute: continuous
    variableUnit: Per metre
    variableDescription: Calibrated Road Failure Intensity per Metre is used as robustness parameter. Positive parameter \lambda_d
      calibrated so length-weighted expected section closure equals severity d. Numerically calibrated over all 343,844 eligible
      positive-length road sections for each finalized severity.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 1719220
  section_failure_probability:
    variableNameInDataset: Section Failure Probability
    variableNameInArticle: Scenario-Specific Road-Section Failure Probability
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Scenario-Specific Road-Section Failure Probability is used as robustness scenario input. q_s(\lambda_d)=1-\exp(-\lambda_d
      L_s), where L_s is Road Section Length (m). Constructed for each Road Section ID and finalized severity under the Length-Dependent
      Independent mechanism; it is not an engineering or observed-event probability.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 1719220
  road_section_failure_indicator:
    variableNameInDataset: Road Section Failure Indicator
    variableNameInArticle: Replicate-Specific Road-Section Closure Indicator
    variableAttribute: boolean
    variableUnit: Boolean indicator
    variableDescription: Replicate-Specific Road-Section Closure Indicator is used as robustness treatment. Z_{srd}=\mathbf{1}[U_{sr}<q_s(\lambda_d)]
      for road section s, replicate r, and severity d. Generated from deterministic seeds; shared scores preserve nested severity
      states within replicate.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 343844
  simulation_replicate:
    variableNameInDataset: Simulation Replicate
    variableNameInArticle: Stochastic Road-State Replicate Identifier
    variableAttribute: count
    variableUnit: Count
    variableDescription: Stochastic Road-State Replicate Identifier is used as robustness identifier. Integer index for one
      reproducible stochastic road-state draw. Generated with deterministic seeds and retained at declared convergence checkpoints.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 343844
  realized_failed_road_length_share:
    variableNameInDataset: Realized Failed Road Length Share
    variableNameInArticle: Realized Unavailable Road-Length Share
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Realized Unavailable Road-Length Share is used as robustness diagnostic. Total Road Section Length
      (m) over failed sections divided by total eligible section length in one replicate. Calculated for every retained stochastic
      state and compared with the target severity.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 1000
  timely_response_probability:
    variableNameInDataset: Timely Response Probability
    variableNameInArticle: Probability of Nominal Fire-Service Response within Threshold
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Probability of Nominal Fire-Service Response within Threshold is used as accessibility reliability
      outcome. Monte Carlo mean of the indicator that minimum fire-service response time does not exceed a declared threshold.
      Estimated separately by Road Failure Model, Expected Failed Road Length Share, and response threshold.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 62945
  p90_response_time_min:
    variableNameInDataset: P90 Response Time (min)
    variableNameInArticle: Ninetieth-Percentile Nominal Fire-Service Response Time
    variableAttribute: continuous
    variableUnit: Minutes
    variableDescription: Ninetieth-Percentile Nominal Fire-Service Response Time is used as accessibility reliability outcome.
      Empirical 90th percentile of minimum response time across stochastic road states; grids with at least 10% disconnection
      are reported as unreachable for the unconditional percentile, and connected-only summaries must be labelled explicitly.
      Estimated from retained stochastic states; it is not an observed response-time percentile.
    variableSource: road_section_failure_probabilities_preprocessed
    observationNumber: 62945
  event_exposed_road_length_m:
    variableNameInDataset: Event-Exposed Road Length (m)
    variableNameInArticle: Event-Hazard-Exposed Length within Road Section
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Event-Hazard-Exposed Length within Road Section is used as intervention exposure. Sum of internal
      Road Length (m) assigned to Warning Zone or Special Warning Zone exposure classes within one Road Section ID. Constructed
      from edge-level event exposure and set to zero where no internal edge is event-exposed.
    variableSource: road_sections_preprocessed
    observationNumber: 343844
  event_exposed_road_length_share:
    variableNameInDataset: Event-Exposed Road Length Share
    variableNameInArticle: Share of Road Section Length with Event-Hazard Exposure
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Share of Road Section Length with Event-Hazard Exposure is used as intervention diagnostic. Event-Exposed
      Road Length (m) divided by Road Section Length (m). Constructed without imputation; values are bounded from zero to
      one.
    variableSource: road_sections_preprocessed
    observationNumber: 343844
  road_restoration_cost_proxy:
    variableNameInDataset: Road Restoration Cost Proxy
    variableNameInArticle: Relative Road-Section Restoration Resource Requirement
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Relative Road-Section Restoration Resource Requirement is used as intervention cost proxy. Event-Exposed
      Road Length (m) divided by the median positive event-exposed road-section length. Constructed only for the 42,068 event-exposed
      sections; unaffected sections remain missing because observed repair duration and monetary cost are unavailable.
    variableSource: road_section_intervention_preprocessed
    observationNumber: 42068
  building_count:
    variableNameInDataset: Building Count
    variableNameInArticle: Building Count per Analysis Cell
    variableAttribute: count
    variableUnit: Count
    variableDescription: Building Count per Analysis Cell is used as spread explanatory. N_j = \sum_b 1(p_b \in j), where
      p_b is the building point-on-surface. Building footprints are projected to EPSG:6670 and assigned to one populated 125
      m cell by point-on-surface location.
    variableSource: buildings_preprocessed
    observationNumber: 62945
  observed_building_footprint_coverage_ratio:
    variableNameInDataset: Observed Building Footprint Coverage Ratio
    variableNameInArticle: Observed Building Footprint Coverage Ratio
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Observed Building Footprint Coverage Ratio is used as spread explanatory. BCR_j = \min\{1, \sum_b
      Area(b \cap j) / Area(j)\}. Exact footprint-cell intersections are calculated in EPSG:6670 and divided by cell area.
    variableSource: buildings_preprocessed
    observationNumber: 62945
  mean_building_separation_m:
    variableNameInDataset: Mean Building Separation (m)
    variableNameInArticle: Mean Nearest-Building Boundary Separation
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Mean Nearest-Building Boundary Separation is used as spread explanatory. D_j = N_{j,valid}^{-1}\sum_{b:p_b\in
      j}\min_{k\ne b} dist(\partial b,\partial k) for buildings with a valid nearest neighbour. Nearest building-boundary
      distances are calculated prefecture-wide in EPSG:6670, so the nearest neighbour may lie across a cell boundary.
    variableSource: buildings_preprocessed
    observationNumber: 62945
  built_continuity_index:
    variableNameInDataset: Built Continuity Index
    variableNameInArticle: Local Built-Form Continuity Index
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Local Built-Form Continuity Index is used as spread explanatory. K_j = N_{j,\leq 6m}/N_{j,valid},
      the share of assigned buildings whose nearest building boundary is no more than 6 m away. Constructed from the same
      prefecture-wide nearest-neighbour search; cells without a valid pair are set to zero.
    variableSource: buildings_preprocessed
    observationNumber: 62945
  firebreak_share:
    variableNameInDataset: Firebreak Share
    variableNameInArticle: Mapped Road-Corridor and Open-Land Firebreak Share
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: 'Mapped Road-Corridor and Open-Land Firebreak Share is used as spread protective. F_j = \min\{1,(A_j^{road}+A_j^{open})/Area(j)\}.
      Road centreline length is converted to corridor area using width-class values of 2, 4.25, 9.25, 16.25, or 22 m (unknown:
      4 m); mapped open-land codes 0902, 1002, 1003, 1100, 1400, and 1500 are added by exact overlap.'
    variableSource: buildings_preprocessed
    observationNumber: 62945
  conditional_spread_susceptibility:
    variableNameInDataset: Conditional Spread Susceptibility
    variableNameInArticle: Conditional Fire-Spread Susceptibility
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Conditional Fire-Spread Susceptibility is used as intermediate outcome. S_j=[R(BCR_j)+R(K_j)+1-R(D_j)+1-R(F_j)]/4,
      where R is the empirical percentile transform. Equal-weight grid screening score conditional on imposed ignition; cells
      with fewer than two buildings receive zero continuity rank, missing inverse-separation values are set to zero, and the
      score is not an ignition probability.
    variableSource: buildings_preprocessed
    observationNumber: 62945
  normal_response_time_min:
    variableNameInDataset: Normal Response Time (min)
    variableNameInArticle: Normal-Scenario Minimum Fire-Service Travel Time
    variableAttribute: continuous
    variableUnit: Minutes
    variableDescription: Normal-Scenario Minimum Fire-Service Travel Time is used as accessibility outcome. T_j^0 = \min_{i
      \in N} t_{ij}^0, capped at 30 min when nominal service is unmet. Shortest-path time from the 81 eligible candidate dispatch
      bases on the explicitly augmented normal road graph.
    variableSource: routable_road_edges_sectioned_preprocessed
    observationNumber: 62945
  disrupted_response_time_min:
    variableNameInDataset: Disrupted Response Time (min)
    variableNameInArticle: Disruption-Scenario Minimum Fire-Service Travel Time
    variableAttribute: continuous
    variableUnit: Minutes
    variableDescription: Disruption-Scenario Minimum Fire-Service Travel Time is used as accessibility outcome. T_j(\omega)
      = \min_{i \in N(\omega)} t_{ij}(\omega), capped at 30 min when nominal service is unmet. Shortest-path time on the declared
      event-specific or stochastic road state after applying its link-availability rule.
    variableSource: routable_road_edges_sectioned_preprocessed
    observationNumber: 62945
  backup_fire_base_count:
    variableNameInDataset: Backup Fire Base Count
    variableNameInArticle: Number of Alternative Candidate Dispatch Bases
    variableAttribute: count
    variableUnit: Count
    variableDescription: Number of Alternative Candidate Dispatch Bases is used as accessibility redundancy. B_j(\omega)=\max\{0,\sum_i1[t_{ij}(\omega)\leq10]-1\}.
      Count of candidate bases beyond the nearest base that can reach the cell within the declared 10-minute threshold.
    variableSource: routable_road_edges_sectioned_preprocessed
    observationNumber: 62945
  single_route_dependence:
    variableNameInDataset: Single Route Dependence
    variableNameInArticle: Shared Shortest-Route Dependence
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Shared Shortest-Route Dependence is used as accessibility vulnerability. For one qualifying base
      the value is 1; for multiple qualifying bases it is the largest number of their selected shortest paths sharing one
      road edge divided by the qualifying-base count. Calculated on the event-specific graph for bases within 10 min; endpoint
      connector edges are excluded and cells without a qualifying route remain missing.
    variableSource: routable_road_edges_sectioned_preprocessed
    observationNumber: 62945
  water_constraint_scenario:
    variableNameInDataset: Water Constraint Scenario
    variableNameInArticle: Bounded Firefighting Water-Availability Scenario
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: 'Bounded Firefighting Water-Availability Scenario is used as scenario input. Two-category boundary
      condition: Normal-reliance boundary or Bounded water-unavailable stress. The stress category is assigned to cell centroids
      within Kumamoto Minami Ward; it is a scenario boundary and not observed hydrant or network failure.'
    variableSource: service_disruptions_preprocessed
    observationNumber: 62945
  conditional_fire_consequence:
    variableNameInDataset: Conditional Fire Consequence
    variableNameInArticle: Weighted Conditional Fire Consequence
    variableAttribute: continuous
    variableUnit: Modelled score units
    variableDescription: Weighted Conditional Fire Consequence is used as main outcome. C_j^{(o)}=S_jE_j^{(o)}(1+A_j+W_j);
      the base consequence layer sets W_j=0, while the combined intervention stress sets W_j=1 inside the bounded water-stress
      area. Exposure E_j^{(o)} is defined separately for population, older population, and critical facilities; A_j is the
      accessibility penalty. The result is conditional on ignition, not a calibrated building-fire probability.
    variableSource: population_mesh_125m_preprocessed
    observationNumber: 62945
  leave_one_out_fire_base_value:
    variableNameInDataset: Leave-One-Out Fire Base Value
    variableNameInArticle: Leave-One-Out Candidate Dispatch-Base Criticality
    variableAttribute: continuous
    variableUnit: Unitless
    variableDescription: Leave-One-Out Candidate Dispatch-Base Criticality is used as station criticality outcome. L_i^{(o)}(\omega)
      = J^{(o)}(N \setminus \{i\}, \omega) - J^{(o)}(N, \omega). Deterministic increase in modelled system loss after removing
      one eligible base from the full represented system under one scenario and exposure objective.
    variableSource: fire_dispatch_bases_preprocessed
    observationNumber: 486
  leave_one_out_fire_base_value_share:
    variableNameInDataset: Leave-One-Out Fire Base Value Share
    variableNameInArticle: Scenario-Normalized Leave-One-Out Fire-Base Criticality Share
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Scenario-Normalized Leave-One-Out Fire-Base Criticality Share is used as station criticality outcome.
      l_i^{(o)}(\omega)=L_i^{(o)}(\omega)/\sum_{k \in N}L_k^{(o)}(\omega) when the denominator is positive. Used only for
      within-scenario comparison across eligible bases; zero-total-loss scenarios remain unidentified.
    variableSource: fire_dispatch_bases_preprocessed
    observationNumber: 486
  road_scenario_leave_one_out_iqr:
    variableNameInDataset: Road-Scenario Leave-One-Out IQR
    variableNameInArticle: Across-Scenario Leave-One-Out Criticality Interquartile Range
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Across-Scenario Leave-One-Out Criticality Interquartile Range is used as station criticality robustness.
      Interquartile range of Leave-One-Out Fire Base Value Share across the declared road states for one base and exposure
      objective. Reported as instability rather than subtracted from the central estimate; no universal composite station
      score is constructed.
    variableSource: fire_dispatch_bases_preprocessed
    observationNumber: 486
  intervention_benefit:
    variableNameInDataset: Intervention Benefit
    variableNameInArticle: Weighted Conditional-Consequence Reduction from Intervention
    variableAttribute: continuous
    variableUnit: Modelled score units
    variableDescription: Weighted Conditional-Consequence Reduction from Intervention is used as decision outcome. Benefit_a(\omega)
      = J_0(\omega) - J_a(\omega). Constructed from the same event-specific baseline and post-action loss calculation; prioritized
      and simple-baseline results are compared within each action class and declared budget definition.
    variableSource: population_mesh_125m_preprocessed
    observationNumber: 40
  retained_protection_gain_share:
    variableNameInDataset: Retained Protection Gain Share
    variableNameInArticle: Fixed-Plan Retained Intervention-Benefit Share
    variableAttribute: continuous
    variableUnit: Proportion from 0 to 1
    variableDescription: Fixed-Plan Retained Intervention-Benefit Share is used as intervention robustness outcome. R_{\mathcal{A}}^{(o)}(\omega_r)=Benefit_{\mathcal{A}}^{(o)}(\omega_r)/Benefit_{\mathcal{A}}^{(o)}(\omega_{event})
      when the event-specific denominator is positive. Select the road-restoration bundle under the event-specific road case,
      evaluate the same bundle unchanged across each predeclared 3% stochastic road state, and retain the ratio without clipping.
    variableSource: population_mesh_125m_preprocessed
    observationNumber: 600
  candidate_staging_site_id:
    variableNameInDataset: Candidate Staging Site ID
    variableNameInArticle: Traceable Candidate Staging-Site Identifier
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Traceable Candidate Staging-Site Identifier is used as intervention identifier. Stable source-prefixed
      identifier for one mapped candidate site. Retain the source facility identifier; use a geometry-derived stable identifier
      for an urban park without a suitable source identifier.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  candidate_staging_site_type:
    variableNameInDataset: Candidate Staging Site Type
    variableNameInArticle: Candidate Staging-Site Facility Class
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Candidate Staging-Site Facility Class is used as intervention explanatory. Categorical source class
      of the mapped candidate site. Classify as Emergency evacuation site, Designated shelter, Public facility, School, or
      Urban park.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  candidate_staging_site_name:
    variableNameInDataset: Candidate Staging Site Name
    variableNameInArticle: Source-Reported Candidate Staging-Site Name
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Source-Reported Candidate Staging-Site Name is used as intervention descriptor. Source-reported name
      of the mapped candidate site. Retain the source name without translation or imputation; every selected site requires
      field verification.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  candidate_source_status:
    variableNameInDataset: Candidate Source Status
    variableNameInArticle: Candidate Staging-Site Source Status
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Candidate Staging-Site Source Status is used as supporting descriptor. Source-reported designation,
      classification, or status retained for candidate screening and audit. Retain the available source value without harmonizing
      it into an operational-readiness measure.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  access_mesh_code:
    variableNameInDataset: Access Mesh Code
    variableNameInArticle: Staging-Site Routing Access Mesh
    variableAttribute: categorical
    variableUnit: Unitless category
    variableDescription: Staging-Site Routing Access Mesh is used as routing key. Identifier of the nearest populated demand
      mesh used to connect a candidate site to the road graph. Match in EPSG:6670 within 250 m; the matched mesh must have
      an accepted network connector and a node in the central event graph.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  staging_to_mesh_distance_m:
    variableNameInDataset: Staging-to-Mesh Distance (m)
    variableNameInArticle: Candidate-Site to Access-Mesh Distance
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Candidate-Site to Access-Mesh Distance is used as routing diagnostic. Euclidean distance from the
      mapped candidate point to its matched Access Mesh Code in EPSG:6670. Retain only matches no greater than 250 m and report
      the distance without imputation.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  staging_access_network_snap_distance_m:
    variableNameInDataset: Staging Access Network Snap Distance (m)
    variableNameInArticle: Access-Mesh to Road-Network Snap Distance
    variableAttribute: continuous
    variableUnit: Metres
    variableDescription: Access-Mesh to Road-Network Snap Distance is used as routing diagnostic. Accepted road-network connector
      distance carried from the matched Access Mesh Code. Use the validated demand-mesh connector; this is not a measured
      driveway or direct facility-access distance.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
  field_verification_required:
    variableNameInDataset: Field Verification Required
    variableNameInArticle: Candidate Staging-Site Field-Verification Flag
    variableAttribute: boolean
    variableUnit: Boolean indicator
    variableDescription: Candidate Staging-Site Field-Verification Flag is used as interpretation boundary. Boolean flag that
      is true for every selected candidate staging site. Indicates that parking, turning space, site safety, capacity, permission,
      fuel, communications, and staffing have not been operationally verified.
    variableSource: public_facilities_preprocessed
    observationNumber: 18
