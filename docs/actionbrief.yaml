analysisStructureBrief:
  overview: Eight linked analytical levels move from declared earthquake-response scenarios through grid screening and network
    reliability to fire-base dependence, interventions, and stress testing. All results are conditional planning screens rather
    than ignition forecasts, causal effects, or real-time operational-capacity estimates.
  levels:
  - levelName: Scenario and evidence contract
    levelAim: Separate observed event context from imposed road, water, ignition, base-removal, and intervention scenarios.
    inputs:
    - Disruption Type
    - Service Status
    - Emergency Road Service Status
    - Water Constraint Scenario
    - Candidate Dispatch Base
    - Verification Status
    modelOrMethod: Use baseline-versus-scenario contrasts with ignition imposed. Event-specific road rules, bounded water
      stress, one-base removal, and stochastic road states are declared separately; no occurrence probability is assigned
      to the 2026 event.
    outputs:
    - Integrated Fire Consequence and Response-System Dependence Framework
    - Scenario Definitions and Interpretation Boundaries
    interpretation: Observed reports define context, while unobserved passability, hydrant status, and operational readiness
      remain assumptions or field-verification requirements.
  - levelName: Built-form susceptibility
    levelAim: Rank populated 125 m cells by mapped conditions that could support spread after an imposed ignition.
    inputs:
    - Observed Building Footprint Coverage Ratio
    - Mean Building Separation (m)
    - Built Continuity Index
    - Firebreak Share
    - Permitted Building Coverage Ratio
    modelOrMethod: Compute S_j = [R(BCR_j) + R(K_j) + 1 - R(D_j) + 1 - R(F_j)] / 4, where R is the empirical percentile transform.
      Permitted Building Coverage Ratio is contextual only.
    outputs:
    - Conditional Fire Susceptibility across Kumamoto
    - Highest-Priority 125 m Cells
    - Robustness and Sensitivity Summary
    interpretation: Higher observed coverage and continuity and lower separation and firebreak share raise the score. It is
      neither ignition probability nor a building-level propagation forecast.
  - levelName: Accessibility and redundancy
    levelAim: Measure how event-specific road disruption changes nominal response time and backup coverage.
    inputs:
    - Road Category
    - Width Category
    - Road State
    - Emergency Road Service Status
    - Hazard Type
    - Candidate Dispatch Base
    modelOrMethod: For cell j, T_j(omega) = min over eligible bases i of shortest-path travel time t_ij(omega), capped at
      30 minutes when nominal service is unmet. Backup Fire Base Count records additional bases within 10 minutes, and shared
      shortest routes define Single Route Dependence.
    outputs:
    - Post-Earthquake Fire-Service Accessibility
    - Municipality Fire Consequence and Accessibility Summary
    interpretation: Road attributes determine assumed speeds and declared removals determine rerouting. Results are nominal
      accessibility, not observed dispatch time, staffing, vehicles, queues, or suppression capacity.
  - levelName: Road-section reliability
    levelAim: Test whether accessibility patterns persist under multiple declared road-section stress mechanisms and severities.
    inputs:
    - Road Section ID
    - Road Section Length (m)
    - Road Failure Model
    - Expected Failed Road Length Share
    - Failure Intensity per Metre
    - Simulation Replicate
    modelOrMethod: Calibrate lambda_d so expected unavailable road length matches target d, then set q_s(lambda_d) = 1 - exp(-lambda_d
      L_s). Reproducible section states trigger full rerouting; 1,000 nominal replicates and 100 alternative-mechanism states
      support reliability and convergence checks.
    outputs:
    - Post-Earthquake Fire-Service Accessibility
    - Scenario and Parameter Robustness
    - Robustness and Sensitivity Summary
    interpretation: Timely Response Probability and P90 Response Time summarize modelled stress states. Full-section unavailability
      is a conservative rescue-safety rule, not evidence that every metre is physically damaged.
  - levelName: Exposure and conditional consequence
    levelAim: Locate cells where susceptibility, response constraints, water boundaries, and vulnerable exposure overlap.
    inputs:
    - Conditional Spread Susceptibility
    - Disrupted Response Time (min)
    - Water Constraint Scenario
    - Total Population
    - Population Age 65+ Share
    - Medical Facility ID
    - School Facility ID
    - Welfare Facility ID
    - Shelter ID
    - Evacuation Site ID
    modelOrMethod: For exposure objective o, compute C_j^(o) = S_j E_j^(o) [1 + A_j + W_j], where S_j is susceptibility, E_j^(o)
      is population, older-population, or critical-facility exposure, A_j is the response-time accessibility penalty, and
      W_j is the bounded water-stress term.
    outputs:
    - Conditional Fire Consequence and Vulnerable Exposure
    - Municipality Fire Consequence and Accessibility Summary
    - Priority Critical Facilities
    - Highest-Priority 125 m Cells
    interpretation: Existing mapped variables determine relative, ignition-conditioned consequence. Separate exposure objectives
      avoid imposing one universal normative weighting; no burned area or individual-building outcome is predicted.
  - levelName: Fire-base removal criticality
    levelAim: Estimate each eligible base's accessibility value as loss of system substitutability after its removal.
    inputs:
    - Candidate Dispatch Base
    - Conditional Fire Consequence
    - Road Failure Model
    - Expected Failed Road Length Share
    modelOrMethod: For base i and objective o, L_i^(o)(omega) = J^(o)(N without i, omega) - J^(o)(N, omega). Normalize by
      the sum across bases only when the denominator is positive and repeat across declared road states and exposure objectives.
    outputs:
    - Fire Base Accessibility Dependence under Road Disruption
    - Fire Base Leave-One-Out Criticality
    - Scenario and Parameter Robustness
    interpretation: A larger value means the represented network has fewer effective substitutes for that base under the scenario.
      It is not a Shapley value or a measure of actual vehicles, personnel, or suppression capacity.
  - levelName: Intervention screening
    levelAim: Prioritize staging, bounded water support, and road restoration within clearly defined resource classes.
    inputs:
    - Candidate Staging Site ID
    - Access Mesh Code
    - Road Section ID
    - Road Restoration Cost Proxy
    - Disrupted Response Time (min)
    - Water Constraint Scenario
    - Conditional Fire Consequence
    modelOrMethod: For action a, Benefit_a(omega) = J_0(omega) - J_a(omega). Within each action class, choose bundles under
      unit-count or length-aware cost-proxy budgets by exact enumeration where feasible or labelled forward selection, then
      compare with simple baselines.
    outputs:
    - Intervention Priorities and Protection Gains
    - Intervention Performance by Budget
    interpretation: Positive benefit is modelled conditional-consequence reduction within the declared scenario. Candidate
      sites require field verification, and incomparable resource classes are not combined into a cost-optimal portfolio.
  - levelName: Robustness and decision limits
    levelAim: Check convergence, ranking stability, component dependence, and retained benefit under alternative declared
      assumptions.
    inputs:
    - Conditional Spread Susceptibility
    - Conditional Fire Consequence
    - Leave-One-Out Fire Base Value Share
    - Road-Scenario Leave-One-Out IQR
    - Retained Protection Gain Share
    - Road Failure Model
    - Expected Failed Road Length Share
    modelOrMethod: Use rank correlations, top-set overlap, membership frequency, replicate checkpoints, component deletion,
      accessibility multipliers, and R_A^(o)(omega_r) = Benefit_A^(o)(omega_r) / Benefit_A^(o)(omega_event) for unchanged
      event-selected road bundles.
    outputs:
    - Scenario and Parameter Robustness
    - Robustness and Sensitivity Summary
    interpretation: High median retained gains indicate typical-state usefulness, while low minimum gains preserve a tail-risk
      warning. Broader built-form sensitivity is deferred and universal robustness is not claimed.
